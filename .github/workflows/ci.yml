name: CI

on:
  # Branches are covered by the pull_request trigger; push only runs for main.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same PR supersedes the run in flight (never cancel main).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    # Draft PRs skip CI until marked ready for review.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # recommended for GitHub-hosted runners: keep source-built wheels,
          # drop pre-built ones before the cache is saved
          prune-cache: true

      - name: Install dev tooling
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check

      # The house dash is a spaced hyphen. Cheap to check, and it was an
      # unwritten rule for long enough to be worth writing down twice.
      - name: No em dashes
        run: ./scripts/no-em-dash.sh

  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      # tests/test_site_real.py runs the whole pipeline against the real
      # corpus, so it needs the data. Without it that file skips, and a
      # silently skipped check is worse than none.
      - name: Check out the collected data
        uses: actions/checkout@v7
        with:
          repository: baz8080/lifts-data
          path: lifts-data

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # recommended for GitHub-hosted runners: keep source-built wheels,
          # drop pre-built ones before the cache is saved
          prune-cache: true

      - name: Rebuild the database from the raw logs
        run: uv run python -m lift_status --data-dir lifts-data rebuild

      - name: Test
        env:
          LIFT_STATUS_DATA_DIR: lifts-data
        run: uv run python -m unittest discover -s tests -t . --verbose
