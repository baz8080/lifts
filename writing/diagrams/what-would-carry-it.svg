<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"
     font-family="system-ui, sans-serif" font-size="12" fill="currentColor" role="img"
     aria-label="Three formats could carry Irish rail station accessibility data. NeTEx,
     SIRI-FM and GTFS-Pathways are all absent for Ireland. What is published is timetables,
     stop lists and a hand-written CMS field.">
  <text x="0" y="14" font-size="13" font-weight="600">What would carry it, and what Ireland publishes</text>

  <!-- left column: would carry it -->
  <text x="0" y="44" font-weight="600">Written for this question</text>
  <g stroke="currentColor" stroke-dasharray="4 3" fill="none">
    <rect x="0" y="54" width="270" height="34" rx="4"/>
    <rect x="0" y="96" width="270" height="34" rx="4"/>
    <rect x="0" y="138" width="270" height="34" rx="4"/>
  </g>
  <text x="10" y="70">NeTEx</text><text x="10" y="84" font-size="11">lifts, ramps, entrances, paths between them</text>
  <text x="10" y="112">SIRI-FM</text><text x="10" y="126" font-size="11">live "is this lift working"</text>
  <text x="10" y="154">GTFS pathways.txt</text><text x="10" y="168" font-size="11">step-free route, entrance to platform</text>
  <text x="0" y="196" font-style="italic">none published for Ireland</text>

  <!-- right column: what exists -->
  <text x="340" y="44" font-weight="600">Actually published</text>
  <g stroke="currentColor" fill="none">
    <rect x="340" y="54" width="290" height="34" rx="4"/>
    <rect x="340" y="96" width="290" height="34" rx="4"/>
    <rect x="340" y="138" width="290" height="34" rx="4"/>
  </g>
  <text x="350" y="70">GTFS, 10 files</text><text x="350" y="84" font-size="11">no wheelchair_boarding column, no hierarchy</text>
  <text x="350" y="112">NaPTAN, PTIMS</text><text x="350" y="126" font-size="11">AccessArea null on all 152 rail stops</text>
  <text x="350" y="154">irishrail.ie platformAccess</text><text x="350" y="168" font-size="11">free text, typed by hand, no schema</text>
  <text x="340" y="196" font-style="italic">the last one is the source this site uses</text>

  <line x1="275" y1="112" x2="335" y2="112" stroke="currentColor" stroke-dasharray="3 3"/>
  <text x="0" y="236" font-size="11">EU 2017/1926 obliges publishing the listed data types "provided they exist in digital</text>
  <text x="0" y="252" font-size="11">machine-readable format". The duty is to publish what you hold, not to create it, so the</text>
  <text x="0" y="268" font-size="11">absence on the left is lawful and has no process that closes it.</text>
</svg>
