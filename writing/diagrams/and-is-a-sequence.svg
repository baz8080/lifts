<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260"
     font-family="system-ui, sans-serif" font-size="12" fill="currentColor" role="img"
     aria-label="Two readings of Hazelhatch's sentence. Read as a choice, the ramp survives a
     lift outage and access looks intact. Read as a sequence, the lift is a link in the chain
     and the outage breaks it.">
  <text x="0" y="14" font-size="13" font-weight="600">"All platforms can be accessed via lifts and ramps"</text>

  <!-- wrong reading -->
  <text x="0" y="46" font-weight="600">Read as a choice (wrong)</text>
  <g stroke="currentColor" fill="none">
    <rect x="0" y="58" width="90" height="30" rx="4"/>
    <rect x="130" y="58" width="90" height="30" rx="4"/>
    <rect x="130" y="98" width="90" height="30" rx="4"/>
  </g>
  <text x="12" y="78">entrance</text>
  <text x="150" y="78">lift</text>
  <text x="146" y="118">ramp</text>
  <line x1="90" y1="73" x2="130" y2="73" stroke="currentColor"/>
  <line x1="90" y1="73" x2="115" y2="113" stroke="currentColor"/>
  <line x1="115" y1="113" x2="130" y2="113" stroke="currentColor"/>
  <line x1="134" y1="62" x2="216" y2="84" stroke="currentColor" stroke-width="2"/>
  <text x="240" y="78">lift out, ramp remains:</text>
  <text x="240" y="94" font-weight="600">"access remains" - the opposite of the truth</text>

  <!-- right reading -->
  <text x="0" y="164" font-weight="600">Read as a sequence (right)</text>
  <g stroke="currentColor" fill="none">
    <rect x="0" y="176" width="90" height="30" rx="4"/>
    <rect x="120" y="176" width="90" height="30" rx="4"/>
    <rect x="240" y="176" width="90" height="30" rx="4"/>
    <rect x="360" y="176" width="90" height="30" rx="4"/>
  </g>
  <text x="12" y="196">entrance</text>
  <text x="146" y="196">ramp</text>
  <text x="276" y="196">lift</text>
  <text x="382" y="196">platform</text>
  <line x1="90" y1="191" x2="120" y2="191" stroke="currentColor"/>
  <line x1="210" y1="191" x2="240" y2="191" stroke="currentColor"/>
  <line x1="330" y1="191" x2="360" y2="191" stroke="currentColor"/>
  <line x1="244" y1="180" x2="326" y2="202" stroke="currentColor" stroke-width="2"/>
  <text x="0" y="232">The ramp gets you along. The lift does the level change. Break one link and the chain is broken:</text>
  <text x="0" y="248" font-weight="600">step-free access to those platforms is gone.</text>
</svg>
