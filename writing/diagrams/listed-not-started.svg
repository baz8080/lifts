<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240"
     font-family="system-ui, sans-serif" font-size="12" fill="currentColor" role="img"
     aria-label="Rush and Lusk. Irish Rail dates the outage from 14 May 2025. Collection began
     on 8 August 2026 with the notice already listed, and it came down on 14 August. Only the
     six listed days were observed; the 451 days before them precede all collection.">
  <text x="0" y="14" font-size="13" font-weight="600">Rush and Lusk: the claim, and the part anyone saw</text>

  <!-- Irish Rail's claim -->
  <line x1="20" y1="58" x2="527" y2="58" stroke="currentColor" stroke-width="8" stroke-opacity="0.22"/>
  <text x="20" y="46">Irish Rail's start, 451.6 days before the first poll</text>

  <!-- collection window -->
  <rect x="340" y="88" width="280" height="14" fill="currentColor" fill-opacity="0.10"/>
  <text x="340" y="82" font-size="11">polled every 30 minutes from here</text>

  <!-- axis, broken -->
  <line x1="20" y1="120" x2="300" y2="120" stroke="currentColor"/>
  <line x1="340" y1="120" x2="620" y2="120" stroke="currentColor"/>
  <line x1="306" y1="112" x2="316" y2="128" stroke="currentColor"/>
  <line x1="324" y1="112" x2="334" y2="128" stroke="currentColor"/>
  <text x="20" y="140">14 May 2025</text>
  <text x="340" y="140" text-anchor="middle">8 Aug 2026</text>
  <text x="527" y="140" text-anchor="middle">14 Aug</text>

  <!-- the listing -->
  <text x="340" y="168" font-size="11">listed: 136.5 hours</text>
  <rect x="340" y="174" width="187" height="14" fill="currentColor" fill-opacity="0.85"/>
  <text x="340" y="204" font-style="italic">the only interval the site measures</text>

  <!-- unwatched -->
  <line x1="20" y1="181" x2="300" y2="181" stroke="currentColor" stroke-dasharray="3 4"/>
  <text x="20" y="204" font-style="italic">nobody was looking</text>

  <text x="0" y="230" font-size="11">Not to scale: fifteen months on the left of the break, nine days on the right.</text>
</svg>
